name: 'Setup EAS Environment'
description: 'Setup pnpm + Node, cache dependencies, setup Expo, and install packages'

inputs:
  expo-token:
    description: 'Expo token for authentication'
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v6
      with:
        # Caches the pnpm store, so no separate actions/cache step is needed
        cache: 'pnpm'

    - name: Setup Expo
      uses: expo/expo-github-action@v9
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
