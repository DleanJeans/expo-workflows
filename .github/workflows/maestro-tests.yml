name: Maestro tests

on:
  workflow_call:

jobs:
  maestro-test:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
        contains(join(github.event.pull_request.labels.*.name, ','), 'run maestro tests')) ||
        (github.event_name == 'issue_comment' &&
        github.actor == 'DleanJeans' &&
        startsWith(github.event.comment.body, '/maestro'))
      }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      ANDROID_SDK_ROOT: /opt/homebrew/share/android-commandlinetools
      MAESTRO_CLI_NO_ANALYTICS: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: React to command comment
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Get PR metadata (issue comment)
        id: pr-metadata
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue?.pull_request) {
              core.setFailed('The /maestro command must be used on a pull request comment.');
              return;
            }
            const prNumber = issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('number', String(prNumber));
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Get PR number (pull request)
        id: pr-number
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-metadata.outputs.head_sha || github.sha }}

      - name: Start emulator if not running
        shell: bash
        run: |
          if adb devices | grep -q "emulator-"; then
            echo "Emulator already running"
            exit 0
          fi

          AVD_NAME=$(emulator -list-avds | head -n1)
          if [ -z "$AVD_NAME" ]; then
            echo "No AVD found on runner."
            exit 1
          fi

          nohup emulator -avd "$AVD_NAME" -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device

      - name: Start Metro if not running
        shell: bash
        run: |
          if lsof -i :8081 | grep -q LISTEN; then
            echo "Metro already running"
            exit 0
          fi
          nohup pnpm start > /tmp/metro.log 2>&1 &
          sleep 15

      - name: Run Maestro tests
        id: maestro
        shell: bash
        run: |
          set +e
          maestro test .maestro > /tmp/maestro-results.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Format Maestro summary
        id: summary
        shell: bash
        run: |
          if [ "${{ steps.maestro.outputs.exit_code }}" = "0" ]; then
            STATUS="✅ Passed"
          else
            STATUS="❌ Failed"
          fi

          {
            echo "body<<EOF"
            echo "## <img src="https://maestro.dev/favicon.svg" width="15" height="15"> Maestro tests: $STATUS"
            echo
            echo "Triggered by \`${{ github.event_name }}\`."
            echo
            echo "### Output (tail)"
            echo '```'
            tail -n 60 /tmp/maestro-results.txt
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR with summary
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number || steps.pr-metadata.outputs.number }}
          BODY: ${{ steps.summary.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: process.env.BODY,
            });

      - name: Fail on Maestro test failure
        if: ${{ steps.maestro.outputs.exit_code != '0' }}
        shell: bash
        run: exit 1
