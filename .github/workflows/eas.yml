name: EAS

on:
  workflow_call:
    inputs:
      app-name:
        description: App name used for APK filename and artifacts
        required: true
        type: string
      expo-project-slug:
        description: Expo project slug for EAS dashboard URL
        required: true
        type: string
      ota-label:
        description: PR label name that triggers OTA update
        required: true
        type: string
      apk-label:
        description: PR label name that triggers APK build
        required: false
        type: string
        default: "rebuild apk"
      timezone:
        description: IANA timezone for the build timestamp in artifact and release names
        required: false
        type: string
        default: "Asia/Ho_Chi_Minh"
      profile:
        description: >-
          EAS build profile to build on workflow_dispatch (development, preview or production).
          Empty falls back to commit-message keywords.
        required: false
        type: string
        default: ""
      auto-build-profiles:
        description: >-
          Comma-separated EAS build profiles (e.g. "development,preview") to build automatically on push
          when their expo-updates runtime version (fingerprint) differs from the latest GitHub release
          of that profile. Needs runtimeVersion { policy: 'fingerprint' } in the app config. Empty turns it off.
        required: false
        type: string
        default: ""
      ntfy-server:
        description: ntfy server used when the ntfy-topic secret is set
        required: false
        type: string
        default: "https://ntfy.sh"
    secrets:
      expo-token:
        required: true
      ntfy-topic:
        description: >-
          ntfy topic for "OTA published" / "APK ready" / failure notifications. Keep it secret: anyone who
          knows a public ntfy.sh topic can read it. Unset turns notifications off.
        required: false

jobs:
  check-labels:
    name: Check labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-build-apk: ${{ steps.labels.outputs.should-build-apk }}
      build-profiles: ${{ steps.labels.outputs.build-profiles }}
      should-send-ota-update: ${{ steps.labels.outputs.should-send-ota-update }}
      runtime-versions: ${{ steps.fingerprint.outputs.runtime-versions || '{}' }}
    steps:
      # Fingerprints decide auto-builds, and stamp each release so later pushes can compare.
      - uses: actions/checkout@v6
        if: ${{ github.event_name != 'pull_request' && inputs.auto-build-profiles != '' }}

      - name: Setup environment
        if: ${{ github.event_name != 'pull_request' && inputs.auto-build-profiles != '' }}
        uses: dleanjeans/expo-workflows/.github/actions/pnpm-expo@main
        with:
          expo-token: ${{ secrets.expo-token }}

      - name: Resolve runtime versions
        id: fingerprint
        if: ${{ github.event_name != 'pull_request' && inputs.auto-build-profiles != '' }}
        shell: bash
        run: |
          # The runtime version (fingerprint) of each APK profile, with that profile's eas.json `env` applied
          # (e.g. APP_VARIANT changes plugins such as expo-dev-client). Only comparable to other values made here.
          result='{}'
          for profile in $(node -e 'const b=require("./eas.json").build||{}; console.log(Object.keys(b).filter(p=>b[p]?.android?.buildType!=="app-bundle").join(" "))'); do
            envs=$(node -e 'const e=require("./eas.json").build[process.argv[1]].env||{}; console.log(Object.entries(e).map(([k,v])=>k+"="+v).join(" "))' "$profile")
            if rv=$(env $envs npx expo-updates runtimeversion:resolve --platform android 2>/dev/null | jq -r '.runtimeVersion // empty'); [[ -n "$rv" ]]; then
              echo "$profile: $rv"
              result=$(jq -c --arg p "$profile" --arg v "$rv" '. + {($p): $v}' <<<"$result")
            else
              echo "::warning::Could not resolve the runtime version for $profile"
            fi
          done
          echo "runtime-versions=$result" >> "$GITHUB_OUTPUT"

      - name: Determine build/update flags
        id: labels
        uses: actions/github-script@v8
        env:
          OTA_LABEL: ${{ inputs.ota-label }}
          APK_LABEL: ${{ inputs.apk-label }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          AUTO_BUILD_PROFILES: ${{ inputs.auto-build-profiles }}
          RUNTIME_VERSIONS: ${{ steps.fingerprint.outputs.runtime-versions || '{}' }}
        with:
          script: |
            const eventName = context.eventName;
            const otaLabel = process.env.OTA_LABEL.toLowerCase();
            const rebuildApkLabel = process.env.APK_LABEL.toLowerCase();

            let shouldBuildApk = false;
            let shouldSendOtaUpdate = false;
            // Commit-message keywords for non-development builds. `build-apk` / the APK label stay development.
            const extraProfiles = new Set();
            const addProfilesFromMessage = (message) => {
              if (message.includes('build-preview')) extraProfiles.add('preview');
              if (message.includes('build-prod')) extraProfiles.add('production');
            };

            const hasLabel = (labels, labelName) =>
              labels.some((label) => String(label.name || '').toLowerCase() === labelName.toLowerCase());

            if (eventName === 'pull_request') {
              const labels = context.payload.pull_request?.labels || [];
              shouldBuildApk = hasLabel(labels, rebuildApkLabel);
              shouldSendOtaUpdate = hasLabel(labels, otaLabel);

            } else if (eventName === 'push') {
              shouldSendOtaUpdate = true;

              const commitMessage = String(context.payload.head_commit?.message || '').toLowerCase();
              if (commitMessage.includes('skip-ota')) {
                shouldSendOtaUpdate = false;
              }
              if (commitMessage.includes('build-apk')) {
                shouldBuildApk = true;
              }
              addProfilesFromMessage(commitMessage);

              // Auto-build profiles whose native fingerprint has no release yet. `skip-build` opts out.
              const autoProfiles = String(process.env.AUTO_BUILD_PROFILES || '')
                .split(',')
                .map((p) => p.trim().toLowerCase())
                .filter(Boolean);
              const runtimeVersions = JSON.parse(process.env.RUNTIME_VERSIONS || '{}');
              if (autoProfiles.length > 0 && !commitMessage.includes('skip-build')) {
                const releases = await github.paginate(github.rest.repos.listReleases, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                });
                const releasedRuntimes = new Set(
                  releases.flatMap((r) => [...String(r.body || '').matchAll(/<!-- runtime:([\w-]+):([\w.-]+) -->/g)].map((m) => `${m[1]}:${m[2]}`))
                );
                for (const profile of autoProfiles) {
                  const runtime = runtimeVersions[profile];
                  if (!runtime) {
                    core.warning(`No runtime version for auto-build profile "${profile}", skipping it`);
                    continue;
                  }
                  if (releasedRuntimes.has(`${profile}:${runtime}`)) {
                    core.info(`${profile}: runtime ${runtime} already released, OTA is enough`);
                    continue;
                  }
                  core.info(`${profile}: new runtime ${runtime}, building`);
                  if (profile === 'development') shouldBuildApk = true;
                  else extraProfiles.add(profile);
                }
              }

              if (context.ref === 'refs/heads/main') {
                const prs = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    commit_sha: context.sha,
                    per_page: 100,
                  }
                );

                const mergedLabels = prs
                  .filter((pr) => pr.merged_at)
                  .flatMap((pr) => (pr.labels || []).map((label) => String(label.name || '').toLowerCase()));

                if (mergedLabels.includes('skip ota')) {
                  shouldSendOtaUpdate = false;
                }
                if (mergedLabels.includes(rebuildApkLabel)) {
                  shouldBuildApk = true;
                }
              }
            } else if (eventName === 'workflow_dispatch') {
              shouldSendOtaUpdate = true;
              const dispatchProfile = String(process.env.DISPATCH_PROFILE || '').trim().toLowerCase();
              if (dispatchProfile === 'development') shouldBuildApk = true;
              else if (dispatchProfile) extraProfiles.add(dispatchProfile);

              if (!dispatchProfile) try {
                const { data: commit } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: context.sha,
                });
                const commitMessage = String(commit.commit.message || '').toLowerCase();
                if (commitMessage.includes('build-apk')) {
                  shouldBuildApk = true;
                }
                addProfilesFromMessage(commitMessage);
              } catch {
                // fallback — no commit context
              }
            }

            const profiles = [...(shouldBuildApk ? ['development'] : []), ...extraProfiles];
            core.setOutput('should-build-apk', profiles.length > 0 ? 'true' : 'false');
            core.setOutput('build-profiles', JSON.stringify(profiles));
            core.setOutput('should-send-ota-update', shouldSendOtaUpdate ? 'true' : 'false');

  ota-update:
    name: OTA Update
    needs: check-labels
    if: ${{ needs.check-labels.outputs.should-send-ota-update == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: dleanjeans/expo-workflows/.github/actions/pnpm-expo@main
        with:
          expo-token: ${{ secrets.expo-token }}

      - name: Determine OTA branch
        id: ota-vars
        uses: actions/github-script@v8
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const isNonMainPush = context.eventName === 'push' && context.ref !== 'refs/heads/main';
            const target = isPR || isNonMainPush ? 'development' : 'preview';
            core.setOutput('branch', target);
            core.setOutput('environment', target);
            core.setOutput('json-flag', isPR ? '--json' : '');

      - name: Push OTA update
        id: ota
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            output_file=$(mktemp)
            eas update --platform android --branch ${{ steps.ota-vars.outputs.branch }} --environment ${{ steps.ota-vars.outputs.environment }} --non-interactive --auto --json | tee "$output_file"
            groupId=$(jq -r '.[0].group // .group // .[0].groupId // .groupId // empty' "$output_file")
            echo "group-id=$groupId" >> "$GITHUB_OUTPUT"
          else
            eas update --platform android --branch ${{ steps.ota-vars.outputs.branch }} --environment ${{ steps.ota-vars.outputs.environment }} --non-interactive --auto
          fi

      - name: Comment OTA dashboard link
        if: ${{ github.event_name == 'pull_request' && steps.ota.outputs.group-id != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const groupId = `${{ steps.ota.outputs.group-id }}`;
            const url = `https://expo.dev/accounts/dleanjeans/projects/${{ inputs.expo-project-slug }}/updates/${groupId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🚀 OTA update published: ${url}`,
            });

      - name: Notify OTA published
        if: ${{ success() }}
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.ntfy-topic }}
          NTFY_SERVER: ${{ inputs.ntfy-server }}
          BRANCH: ${{ steps.ota-vars.outputs.branch }}
          GROUP_ID: ${{ steps.ota.outputs.group-id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}
        run: |
          [[ -z "$NTFY_TOPIC" ]] && exit 0
          url="https://expo.dev/accounts/dleanjeans/projects/${{ inputs.expo-project-slug }}/updates${GROUP_ID:+/$GROUP_ID}"
          curl -fsS -H "Title: ${{ inputs.app-name }}: OTA on $BRANCH" -H "Tags: rocket" -H "Click: $url" \
            -d "$(head -n1 <<<"$COMMIT_MESSAGE"). Reopen the app twice, or tap the update banner." "$NTFY_SERVER/$NTFY_TOPIC" || true

      - name: Notify OTA failed
        if: ${{ failure() }}
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.ntfy-topic }}
          NTFY_SERVER: ${{ inputs.ntfy-server }}
        run: |
          [[ -z "$NTFY_TOPIC" ]] && exit 0
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -H "Title: ${{ inputs.app-name }}: OTA failed" -H "Tags: x" -H "Priority: high" -H "Click: $run_url" \
            -d "OTA update on ${{ github.ref_name }} failed." "$NTFY_SERVER/$NTFY_TOPIC" || true

  build-apk:
    name: Build ${{ matrix.profile }}
    needs: check-labels
    if: ${{ needs.check-labels.outputs.should-build-apk == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.check-labels.outputs.build-profiles) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: dleanjeans/expo-workflows/.github/actions/pnpm-expo@main
        with:
          expo-token: ${{ secrets.expo-token }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set build variables
        id: build-vars
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TZ: ${{ inputs.timezone }}
        run: |
          # YYYYMMDD-HHMMSS in inputs.timezone (default GMT+7)
          ts=$(date +'%Y%m%d-%H%M%S')
          # Development keeps the old names; other profiles add the profile so releases don't collide.
          base="${{ inputs.app-name }}"
          if [[ "$PROFILE" != "development" ]]; then base="$base-$PROFILE"; fi
          # Profiles with android.buildType "app-bundle" (usually production) produce an .aab.
          ext=$(node -e 'const p=require("./eas.json").build?.[process.argv[1]]; process.stdout.write(p?.android?.buildType === "app-bundle" ? "aab" : "apk")' "$PROFILE")
          echo "datetime=$ts" >> "$GITHUB_OUTPUT"
          echo "apk-filename=$base-$ts.$ext" >> "$GITHUB_OUTPUT"
          echo "zip-filename=$base-$ts.zip" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: eas build --platform android --profile ${{ matrix.profile }} --local --non-interactive --output ./${{ steps.build-vars.outputs.apk-filename }}

      - name: Zip APK
        shell: bash
        run: zip ./${{ steps.build-vars.outputs.zip-filename }} ./${{ steps.build-vars.outputs.apk-filename }}

      - name: Upload APK artifact (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build-vars.outputs.zip-filename }}
          path: ./${{ steps.build-vars.outputs.zip-filename }}

      - name: Comment artifact link (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `📦 ${{ matrix.profile }} build complete. Download from workflow artifacts: ${runUrl}`,
            });

      - name: Create release (non-PR)
        id: release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build-vars.outputs.zip-filename }}
          name: ${{ steps.build-vars.outputs.zip-filename }}
          # The raw APK is for installers such as Obtainium; the marker lets auto-builds skip known fingerprints.
          body: |
            `${{ matrix.profile }}` build of ${{ github.sha }}.

            <!-- runtime:${{ matrix.profile }}:${{ fromJSON(needs.check-labels.outputs.runtime-versions)[matrix.profile] || 'unknown' }} -->
          files: |
            ./${{ steps.build-vars.outputs.zip-filename }}
            ./${{ steps.build-vars.outputs.apk-filename }}

      - name: Notify build ready
        if: ${{ success() }}
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.ntfy-topic }}
          NTFY_SERVER: ${{ inputs.ntfy-server }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TAG: ${{ steps.build-vars.outputs.zip-filename }}
          FILE: ${{ steps.build-vars.outputs.apk-filename }}
        run: |
          [[ -z "$NTFY_TOPIC" ]] && exit 0
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ -n "$RELEASE_URL" ]]; then
            download="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$FILE"
            curl -fsS -H "Title: ${{ inputs.app-name }}: ${{ matrix.profile }} build ready" -H "Tags: package" \
              -H "Click: $RELEASE_URL" -H "Actions: view, Download APK, $download" \
              -d "$FILE" "$NTFY_SERVER/$NTFY_TOPIC" || true
          else
            curl -fsS -H "Title: ${{ inputs.app-name }}: ${{ matrix.profile }} build ready" -H "Tags: package" \
              -H "Click: $run_url" -d "Download from the workflow artifacts." "$NTFY_SERVER/$NTFY_TOPIC" || true
          fi

      - name: Notify build failed
        if: ${{ failure() || cancelled() }}
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.ntfy-topic }}
          NTFY_SERVER: ${{ inputs.ntfy-server }}
        run: |
          [[ -z "$NTFY_TOPIC" ]] && exit 0
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -H "Title: ${{ inputs.app-name }}: ${{ matrix.profile }} build failed" -H "Tags: x" -H "Priority: high" \
            -H "Click: $run_url" -d "Build on ${{ github.ref_name }} did not finish." "$NTFY_SERVER/$NTFY_TOPIC" || true
