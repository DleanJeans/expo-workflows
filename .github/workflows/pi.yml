name: Pi Agent

on:
  workflow_call:
    inputs:
      trigger-phrase:
        description: Trigger phrase to activate Pi (e.g., "pi:", "/pi")
        required: false
        type: string
        default: "pi:"
      provider:
        description: LLM provider (opencode-go, deepseek, anthropic, openai, google, etc.)
        required: false
        type: string
        default: opencode-go
      default-model:
        description: Default model when no pi:[model] override is given
        required: false
        type: string
        default: deepseek-v4-flash
      node-version:
        description: Node.js version for the runner
        required: false
        type: string
        default: "24"
      timeout-minutes:
        description: Workflow timeout in minutes
        required: false
        type: number
        default: 30
    secrets:
      api-key:
        description: API key for the LLM provider (e.g., OPENCODE_API_KEY)
        required: true

concurrency:
  group: pi-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  pi-agent:
    if: >-
      ${{
        github.actor == 'DleanJeans' && contains(github.event.comment.body || '', inputs.trigger-phrase)
      }}
    runs-on: self-hosted
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Parse trigger[model] and build clean prompt
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const trigger = '${{ inputs.trigger-phrase }}';
            const escTrigger = trigger.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const body = context.payload.comment?.body ||
                         context.payload.review?.body ||
                         '';

            const modelRe = new RegExp('^' + escTrigger + '\\[([^\\]]+)\\]\\s*([\\s\\S]*)');
            const stripRe = new RegExp('^' + escTrigger + '\\s*');
            const match = body.match(modelRe);
            let model, prompt;

            if (match) {
              model = match[1].trim();
              prompt = match[2].trim();
            } else {
              prompt = body.replace(stripRe, '').trim();
            }

            // On issues (not PRs), default to creating a PR unless user asks for discussion
            const isPR = !!context.payload.issue?.pull_request;
            const discussWords = ['explain', 'plan', 'review', 'analyze', 'describe', 'thoughts'];
            const isDiscussion = discussWords.some(w => prompt.toLowerCase().includes(w));

            if (!isPR && !isDiscussion) {
              prompt = (prompt ? prompt : 'Address the issue.') +
                '\n\nImportant: create a branch, open a pull request with the changes, ' +
                'and leave a comment on this issue mentioning the branch name.';
            }

            core.setOutput('model', model || '${{ inputs.default-model }}');
            core.setOutput('prompt', prompt);

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run Pi agent
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger: ${{ inputs.trigger-phrase }}
          provider: ${{ inputs.provider }}
          model: ${{ steps.parse.outputs.model }}
          prompt: ${{ steps.parse.outputs.prompt }}
          token: ${{ secrets.api-key }}
          auto_compaction: true
